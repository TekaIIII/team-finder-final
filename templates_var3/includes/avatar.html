<span
  class="{{ avatar_class }} buk-ava"
  role="img"
  aria-label="Аватар: {{ avatar_user.name }} {{ avatar_user.surname }}"
>
  <span class="buk-ava-letter" aria-hidden="true">
    {{ avatar_user.name|default:"?"|first|upper }}
  </span>

  {% with avatar_src=avatar_user.avatar_url %}
    <img
      class="buk-ava-img"
      alt=""
      aria-hidden="true"
      {% if avatar_src %}
        src="{{ avatar_src }}"
      {% else %}
        hidden
      {% endif %}
    >
  {% endwith %}
</span>
